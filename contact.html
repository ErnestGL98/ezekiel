<body class="contact-page">

  <!-- THE BACKGROUND — frame 10 of the APOTTS SS24 Urbanearth shoot, held
       still behind the page while it scrolls. A real <img> rather than a
       CSS background, so it gets the same lazy decoding as every other
       photo and never delays the form. alt="" because it is decoration:
       the same photo is described properly in its gallery. -->
  <div class="contact-bg" aria-hidden="true">
    <img src="images/galleries/apotts-ss24-urbanearth/10.webp" alt="" decoding="async">
  </div>

  <!-- The same header as the portfolio and the galleries, so moving
       between them doesn't shift anything. -->
  <header class="page-header">
    <div class="page-header__left">
      <a class="page-header__mark glitch-text" href="./">Ezekiel</a>
      <button class="sound-toggle" type="button" aria-pressed="true"
              aria-label="Turn sound off">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="sound-toggle__cone" d="M 12.21 20.09 L 11.85 19.94 L 11.67 18.63 L 10.72 17.88 L 9.98 17.66 L 9.32 16.82 L 8.42 16.31 L 7.83 16.48 L 6.48 16.18 L 5.90 16.45 L 2.59 16.75 L 1.22 16.71 L 0.99 16.39 L 1.77 15.93 L 1.70 11.23 L 1.35 10.44 L 1.64 10.17 L 2.12 8.39 L 2.60 8.55 L 2.77 9.88 L 5.90 9.79 L 7.53 9.47 L 10.58 6.01 L 12.93 3.94 L 13.09 4.34 L 11.99 5.66 L 12.26 6.04 L 12.02 6.67 L 12.32 9.82 L 12.14 13.58 L 12.55 15.87 L 12.38 16.71 L 12.92 18.40 L 12.39 18.94 Z"/>
          <g class="sound-toggle__waves">
            <path d="M 14.20 15.87 L 13.86 15.81 L 13.84 15.45 L 15.08 13.74 L 15.39 11.93 L 15.07 10.88 L 14.54 10.65 L 13.72 9.70 L 13.65 9.24 L 13.86 9.07 L 16.19 10.37 L 16.96 11.99 L 16.64 14.30 L 15.39 15.43 Z"/>
            <path d="M 18.36 19.25 L 17.63 19.10 L 17.46 18.50 L 18.60 18.01 L 20.80 15.67 L 21.48 12.05 L 21.11 9.36 L 20.51 7.77 L 19.22 6.53 L 18.68 5.65 L 18.44 5.95 L 18.40 5.48 L 17.41 5.15 L 17.55 4.72 L 17.33 4.32 L 17.54 4.07 L 18.40 4.48 L 19.28 4.56 L 21.34 6.24 L 22.80 9.24 L 23.05 11.99 L 22.08 15.95 L 21.64 16.71 L 21.00 17.60 Z"/>
          </g>
        </svg>
      </button>
      <span class="sound-hint" aria-hidden="true"></span>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <a class="glitch-text" href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="gallery-head">
      <a class="back-link" href="portfolio.html">
        <span aria-hidden="true">&#8592;</span> Portfolio
      </a>
      <h1 class="gallery-title glitch-text">Contact</h1>
    </div>

    <!-- ============================================================
         THE FORM — your email, a subject, a message.

         WHERE THE MESSAGES GO. GitHub Pages only serves files; it cannot
         receive anything. So the form posts to Formspree, which emails
         each message on. Its address is in BOTH action and data-endpoint
         below; to move to another form or service, change both and
         nothing else. (Empty would mean not connected, and the form says
         so rather than pretending to send.)

         THE EMAIL'S SUBJECT LINE. Formspree takes it from a field named
         exactly "subject" — so the visitor's own box is named "topic",
         and a hidden "subject" field builds the real one around it:
         "Email for Ezekiel: <whatever they typed>". That way every one of
         these is easy to spot and filter in the inbox. The SENDER name
         cannot be changed on Formspree's free plan (Business plan only),
         so the prefix does that job instead.

         Also works with JavaScript off: then it is an ordinary form post
         to the same address (the action attribute), so the message still
         arrives — the visitor just sees the service's own thank-you page.
         ============================================================ -->
    <form class="contact-form" method="POST" action="https://formspree.io/f/mnpnddgd" data-endpoint="https://formspree.io/f/mnpnddgd" novalidate>

      <div class="field">
        <label class="field__label" for="c-email">Your email</label>
        <input class="field__input" id="c-email" name="email" type="email"
               autocomplete="email" required maxlength="254">
        <p class="field__error" id="c-email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label class="field__label" for="c-subject">Subject</label>
        <input class="field__input" id="c-subject" name="topic" type="text"
               required maxlength="150">
        <p class="field__error" id="c-subject-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label class="field__label" for="c-message">Message</label>
        <textarea class="field__input field__input--area" id="c-message" name="message"
                  rows="7" required maxlength="5000"></textarea>
        <p class="field__error" id="c-message-error" aria-live="polite"></p>
      </div>

      <!-- Formspree fills {{ topic }} in with the visitor's own subject. -->
      <input type="hidden" name="subject" value="Email for Ezekiel: {{ topic }}">

      <!-- A spam trap. Hidden from people (and from screen readers, and
           skipped by Tab), but bots fill in every box they find. Anything
           in it and the message is quietly dropped. The name _gotcha is
           the one the common form services already look for. -->
      <div class="contact-form__trap" aria-hidden="true">
        <label for="c-gotcha">Leave this empty</label>
        <input id="c-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button class="contact-form__send" type="submit">Send</button>
      <p class="contact-form__status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <!-- MUSIC PLAYER — the same one as the portfolio and galleries, so the
       music carries in here and back out. -->
  <div class="player" hidden>
    <div class="player__controls">
      <button class="player__btn player__prev" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 5v14H5V5z"/><path d="M20 5v14l-11-7z"/>
        </svg>
      </button>

      <button class="player__btn player__toggle" type="button"
              aria-pressed="false" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="player__icon-play" d="M7 4v16l13-8z"/>
          <path class="player__icon-pause" d="M7 4h4v16H7zM14 4h4v16h-4z"/>
        </svg>
      </button>

      <button class="player__btn player__next" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M17 5v14h2V5z"/><path d="M4 5v14l11-7z"/>
        </svg>
      </button>

      <button class="player__btn player__mute" type="button"
              aria-pressed="true" aria-label="Mute music">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 9v6h4l5 4V5L7 9H3z"/>
          <g class="player__icon-waves" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round">
            <path d="M15.5 9a4.5 4.5 0 0 1 0 6"/>
            <path d="M18.2 6.6a8 8 0 0 1 0 10.8"/>
          </g>
          <g class="player__icon-cross" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round">
            <path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
          </g>
        </svg>
      </button>

      <div class="player__volume" role="slider" tabindex="0" aria-label="Volume"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
        <div class="player__volume-fill"></div>
      </div>
    </div>

    <div class="player__bar" role="slider" tabindex="0" aria-label="Seek"
         aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="player__fill"></div>
    </div>

    <div class="player__meta">
      <span class="player__title"></span>
      <span class="player__time">0:00 / 0:00</span>
    </div>
  </div>

  <script src="js/player.js?v=81" defer></script>

</body>
