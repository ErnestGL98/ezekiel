<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tells the browser the file is UTF-8 (so accents/symbols render right) -->
  <meta charset="UTF-8">

  <!-- THE most important line for a mobile-ready site.
       It tells phones: "use the real device width, don't pretend to be a desktop." -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Text that shows in Google results / when the link is shared -->
  <title>EZEKIEL — Model Portfolio</title>
  <meta name="description" content="Portfolio and experience of model Ezekiel.">

  <!-- Colors the phone's browser chrome (address bar) to match the site -->
  <meta name="theme-color" content="#F2EEE7">

  <!-- Start downloading the handwriting font immediately, in parallel with
       the stylesheet, instead of waiting for the CSS to be parsed first. -->
  <!-- The ?v=88 must match the one in style.css — see the note there. -->
  <link rel="preload" href="fonts/OldEnglish.woff2?v=88" as="font" type="font/woff2" crossorigin>

  <!-- Our own stylesheet. Versioned too, so a changed stylesheet also
       shows up straight away instead of after the 10-minute cache. -->
  <link rel="stylesheet" href="css/style.css?v=88">

  <!-- REFRESHING THE HOME PAGE STARTS THE WHOLE VISIT OVER.
       The rest of the site remembers things for the length of a visit —
       where the music was, whether the speaker is on, whether the photo
       controls have been explained. A refresh here wipes all of it, so
       the portfolio after it is a fresh visit: a new song order, the
       speaker off, the hint shown again.

       Only on a REFRESH. Arriving here by clicking the wordmark is still
       the same visit and keeps everything.

       Only this site's own entries, by their ezekiel- prefix, never
       sessionStorage.clear(): every site under ernestgl98.github.io shares
       this storage, and clearing it would wipe theirs too. -->
  <script>
    (function () {
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        if (!nav || nav.type !== 'reload') return;
        for (var i = sessionStorage.length - 1; i >= 0; i--) {
          var k = sessionStorage.key(i);
          if (k && k.indexOf('ezekiel-') === 0) sessionStorage.removeItem(k);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="home">

  <!-- ============================================================
       THE HOME PAGE IS NOW ONE ROW OF FOUR.
       Ezekiel, Portfolio, Contact, Instagram — all peers, spread
       evenly across the full width and sitting on the page's vertical
       centre line. There is no separate header nav and no logo above
       the row any more: "Ezekiel" IS the first of the four.
       ============================================================ -->
  <section class="hero">

    <!-- The photo. object-fit:cover (in the CSS) makes it fill the box
         without stretching. fetchpriority="high" tells the browser this
         is the most important image on the page, load it first. -->
    <img
      class="hero__image"
      src="images/Home_page_compressed.jpg"
      alt="Ezekiel wearing an embroidered tan workwear jacket and trousers"
      fetchpriority="high"
      decoding="async">

    <!-- A see-through dark layer over the photo.
         Purely so the white text stays readable on the light parts. -->
    <div class="hero__scrim" aria-hidden="true"></div>

    <!-- FOUR EQUAL COLUMNS, each word centred in its own share of the
         width — which is what spreads them evenly rather than just
         pushing the outer two to the edges.

         It is a <nav> because that is what it now is. "Ezekiel" keeps
         the <h1> so the page still has a heading for search engines and
         screen readers, and still links home with a real <a>: the
         keyboard, middle-click and open-in-new-tab all keep working. -->
    <nav class="hero__nav" aria-label="Main navigation">
      <h1 class="hero__name">
        <a class="hero__link glitch-text glitch-light" href="./">Ezekiel</a>
      </h1>
      <a class="hero__link glitch-text glitch-light" href="portfolio.html">Portfolio</a>
      <a class="hero__link glitch-text glitch-light" href="contact.html">Contact</a>
      <!-- INSTAGRAM: not clickable until the handle is in. Rendered as a
           <span> rather than an <a href="#">, so it cannot be tabbed to
           or clicked into a dead end. To finish it, swap this one line
           for:
             <a class="hero__link glitch-text glitch-light"
                href="https://www.instagram.com/HANDLE/"
                target="_blank" rel="noopener">Instagram</a> -->
      <span class="hero__link hero__link--waiting glitch-text glitch-light">Instagram</span>
    </nav>

  </section>

  <!-- The only script FILE on this page (the small one in the head just
       resets the visit on a refresh), and only for the four words.
       No player, no audio: the effect runs silent here because there is no speaker in
       this header to turn it off with, and sound you cannot switch off is
       worse than none. glitch.js checks for that itself. -->
  <script src="js/glitch.js?v=88" defer></script>

</body>
</html>
