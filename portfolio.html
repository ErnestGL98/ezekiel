  <!-- ============================================================
       HEADER
       Different from the home page's header: that one floats in white
       over the photo, this one sits in normal flow on the cream
       background, so it needs dark text and its own class.
       ============================================================ -->
  <header class="page-header">
    <a class="page-header__mark" href="./">Ezekiel</a>

      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="page-main">

    <h1 class="page-title">Portfolio</h1>

    <!-- ============================================================
         THE GRID — 15 slots, one per shoot or event.

         HOW TO FILL ONE IN, when you have the photos:

         1. Put the cover photo in the images/ folder
         2. Replace the whole <span class="tile__num">01</span> line with:
              <img src="images/your-photo.jpg" alt="Short description">
         3. Change "Shoot 01" (the line above the frame) to the
            real name of the shoot
         4. Change href="#" to the gallery page for that shoot,
            e.g. href="gallery-subway.html"

         The layout is 2 across on a phone and 3 across on anything
         wider, so 15 fills exactly 5 rows with no gaps.
         ============================================================ -->
    <div class="grid">

      <!-- ---- 01 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Shoot 01</span>
        <span class="tile__frame"><span class="tile__num">01</span></span>
      </a>
