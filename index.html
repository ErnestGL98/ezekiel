<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tells the browser the file is UTF-8 (so accents/symbols render right) -->
  <meta charset="UTF-8">

  <!-- THE most important line for a mobile-ready site.
       It tells phones: "use the real device width, don't pretend to be a desktop." -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Text that shows in Google results / when the link is shared -->
  <title>EZEKIEL — Model Portfolio</title>
  <meta name="description" content="Portfolio and experience of model Ezekiel.">

  <!-- Colors the phone's browser chrome (address bar) to match the site -->
  <meta name="theme-color" content="#F2EEE7">

  <!-- Start downloading the handwriting font immediately, in parallel with
       the stylesheet, instead of waiting for the CSS to be parsed first. -->
  <!-- The ?v=65 must match the one in style.css — see the note there. -->
  <link rel="preload" href="fonts/EzekielHand.woff2?v=65" as="font" type="font/woff2" crossorigin>

  <!-- Our own stylesheet. Versioned too, so a changed stylesheet also
       shows up straight away instead of after the 10-minute cache. -->
  <link rel="stylesheet" href="css/style.css?v=65">
</head>

<body>

  <!-- ============================================================
       HEADER — small nav that floats on top of the hero image.
       The link points to "#" for now; swap it for the real filename
       (contact.html) once that page exists.
       ============================================================ -->
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- ============================================================
       HERO — full-screen photo with the name centered on top.
       The <h1> IS the logo, exactly as requested.
       ============================================================ -->
  <section class="hero">

    <!-- The photo. object-fit:cover (in the CSS) makes it fill the box
         without stretching. fetchpriority="high" tells the browser this
         is the most important image on the page, load it first. -->
    <img
      class="hero__image"
      src="images/Home_page_compressed.jpg"
      alt="Ezekiel wearing an embroidered tan workwear jacket and trousers"
      fetchpriority="high"
      decoding="async">

    <!-- A see-through dark layer over the photo.
         Purely so the white text stays readable on the light parts. -->
    <div class="hero__scrim" aria-hidden="true"></div>

    <!-- The content that sits ON TOP of the photo.
         This is a 3-row grid (see the CSS): an empty stretchy row,
         the logo, then another empty stretchy row. The two equal
         stretchy rows are what pin the logo to the exact centre. -->
    <div class="hero__content">
      <!-- The name doubles as the logo and as the home link. A real <a>
           rather than a JavaScript click handler, so it still works with
           the keyboard, with middle-click, and with open-in-new-tab.
           "./" means "this folder's index page" — so on the home page it
           reloads, and from any future page it comes back here. -->
      <h1 class="hero__logo"><a class="hero__logo-link" href="./">Ezekiel</a></h1>

      <!-- It lives in the row BELOW the logo, so it hangs off the centre
           line without pushing the logo off-centre. -->
      <a class="button" href="portfolio.html">View Portfolio</a>
    </div>

  </section>

</body>
</html>
