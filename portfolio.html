<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio — EZEKIEL</title>
  <meta name="description" content="Shoots and events from model Ezekiel's portfolio.">
  <meta name="theme-color" content="#F2EEE7">

  <!-- Both weights are used above the fold on this page (the title is
       regular, the shoot names are bold), so start both downloading
       immediately rather than waiting for the CSS to be parsed. -->
  <!-- The ?v=26 must match the one in style.css — see the note there. -->
  <link rel="preload" href="fonts/EzekielHand.woff2?v=26" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EzekielHand-Bold.woff2?v=26" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=26">
</head>

<body>

  <!-- ============================================================
       HEADER
       Different from the home page's header: that one floats in white
       over the photo, this one sits in normal flow on the cream
       background, so it needs dark text and its own class.
       ============================================================ -->
  <header class="page-header">
    <div class="page-header__left">
      <a class="page-header__mark" href="./">Ezekiel</a>

      <!-- Sound switch for the hover effect.
           The speaker is Ezekiel's own drawing, traced to vectors by
           tools/build_icon.py — same treatment as the handwriting.

           It lives in the HTML rather than being created by the script so
           it can't shift the layout when it appears, but it stays hidden
           until the script adds .js-glitch — no point offering to mute
           something that isn't running.
           Clicking it also doubles as the interaction browsers require
           before any page is allowed to make a sound. -->
      <button class="sound-toggle" type="button" aria-pressed="true"
              aria-label="Turn hover sound off">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <!-- the cone, drawn in both states -->
          <path class="sound-toggle__cone" d="M 12.21 20.09 L 11.85 19.94 L 11.67 18.63 L 10.72 17.88 L 9.98 17.66 L 9.32 16.82 L 8.42 16.31 L 7.83 16.48 L 6.48 16.18 L 5.90 16.45 L 2.59 16.75 L 1.22 16.71 L 0.99 16.39 L 1.77 15.93 L 1.70 11.23 L 1.35 10.44 L 1.64 10.17 L 2.12 8.39 L 2.60 8.55 L 2.77 9.88 L 5.90 9.79 L 7.53 9.47 L 10.58 6.01 L 12.93 3.94 L 13.09 4.34 L 11.99 5.66 L 12.26 6.04 L 12.02 6.67 L 12.32 9.82 L 12.14 13.58 L 12.55 15.87 L 12.38 16.71 L 12.92 18.40 L 12.39 18.94 Z"/>
          <!-- the waves, hidden when muted. The cone keeps the same
               coordinates in both states, so it doesn't jump. -->
          <g class="sound-toggle__waves">
            <path d="M 14.20 15.87 L 13.86 15.81 L 13.84 15.45 L 15.08 13.74 L 15.39 11.93 L 15.07 10.88 L 14.54 10.65 L 13.72 9.70 L 13.65 9.24 L 13.86 9.07 L 16.19 10.37 L 16.96 11.99 L 16.64 14.30 L 15.39 15.43 Z"/>
            <path d="M 18.36 19.25 L 17.63 19.10 L 17.46 18.50 L 18.60 18.01 L 20.80 15.67 L 21.48 12.05 L 21.11 9.36 L 20.51 7.77 L 19.22 6.53 L 18.68 5.65 L 18.44 5.95 L 18.40 5.48 L 17.41 5.15 L 17.55 4.72 L 17.33 4.32 L 17.54 4.07 L 18.40 4.48 L 19.28 4.56 L 21.34 6.24 L 22.80 9.24 L 23.05 11.99 L 22.08 15.95 L 21.64 16.71 L 21.00 17.60 Z"/>
          </g>
        </svg>
      </button>

      <!-- Fading hint beside the switch. aria-hidden because the button's
           own aria-pressed already announces the state — a second spoken
           copy would just be noise. Positioned absolutely so it can't
           shove the header around as it appears and disappears. -->
      <span class="sound-hint" aria-hidden="true"></span>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- ============================================================
       BANNER — full-bleed strip, so it sits OUTSIDE <main> (which is
       capped at 1200px). The word PORTFOLIO is a separate layer
       stacked on top of the photo, not baked into the image, so it
       stays crisp at any size and is real selectable text.
       ============================================================ -->
  <section class="banner">
    <img
      class="banner__image"
      src="images/portfolio-banner.jpg"
      alt="Ezekiel in an orange seersucker coat and jumpsuit"
      fetchpriority="high"
      decoding="async">
    <div class="banner__scrim" aria-hidden="true"></div>
    <h1 class="banner__title">Portfolio</h1>
  </section>

  <main class="page-main">

    <!-- ============================================================
         THE GRID — one tile per shoot or event, in alphabetical order.

         TO ADD ANOTHER SHOOT:
         1. Put the photo in the "portfolio covers" folder in Downloads
         2. Run:  python tools/build_covers.py
            That shrinks it for the web. The originals are camera files
            — one was 90MB — and would take minutes to load on a phone.
         3. Copy any block below and point its src= at the new file

         TO LINK A TILE TO ITS GALLERY:
         change href="#" to that shoot's page, e.g. href="gallery-essx.html"

         The first three load straight away because they're on screen;
         the rest use loading="lazy" so they only download once you
         scroll near them.
         ============================================================ -->
    <div class="grid">

      <!-- ---- 01 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS AW22 - Skinfolk</span>
        <span class="tile__frame"><img src="images/covers/apotts-aw22-skinfolk.jpg" alt="APOTTS AW22 for Skinfolk" decoding="async"></span>
      </a>

      <!-- ---- 02 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS Ecomm 25</span>
        <span class="tile__frame"><img src="images/covers/apotts-ecomm-25.jpg" alt="APOTTS ecommerce shoot 25" decoding="async"></span>
      </a>

      <!-- ---- 03 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS SS24 - Urbanearth</span>
        <span class="tile__frame"><img src="images/covers/apotts-ss24-urbanearth.jpg" alt="APOTTS SS24 for Urbanearth" decoding="async"></span>
      </a>

      <!-- ---- 04 ---- -->
      <a class="tile" href="#">
        <!-- The brand styles its own name in mixed case, so this label opts
             out of the uppercasing the other tiles use — otherwise the CSS
             would turn it into "(B).STROY X (B).USBY". -->
        <span class="tile__name tile__name--asis">(b).STROY MOHAWK x (b).USBY</span>
        <span class="tile__frame"><img src="images/covers/b-stroy-mohawk-b-usby.jpg" alt="(b).STROY MOHAWK x (b).USBY" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 05 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Daveed Baptist - Soaring High SS26</span>
        <span class="tile__frame"><img src="images/covers/daveed-baptist-soaring-high-ss26.jpg" alt="Daveed Baptist, Soaring High SS26" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 06 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Essx Spring Summer</span>
        <span class="tile__frame"><img src="images/covers/essx-spring-summer.jpg" alt="Essx Spring Summer" loading="lazy" decoding="async"></span>
      </a>

      <!-- ============================================================
           (b).STROY PARIS — two media rows, sitting after the second row
           of tiles.

           These are laid out on the SAME grid as the tiles, just spanning
           more columns, which is what makes their outer edges line up
           exactly with the covers above and below.

           The two rows mirror each other — still/clip, then clip/still —
           so the block reads as a pair rather than a repeat.

           The clips keep their natural 16:9 and the stills their natural
           square. Forcing both to one shape would either cut the boots off
           the full-length looks or crop the runway's chandeliers out of
           frame, so instead the shorter one centres against the taller.
           ============================================================ -->

      <!-- ---- Paris, row one: still left, clip right ---- -->
      <figure class="media media--still media--left">
        <img src="images/looks/bstroy-paris-orange.jpg"
             alt="(b).stroy Paris FW — orange hooded look" loading="lazy" decoding="async">
      </figure>

      <figure class="media media--clip">
        <!-- muted + autoplay together on purpose: browsers only allow a
             clip to start on its own if it's silent. "controls" is what
             lets someone unmute it themselves. -->
        <video src="video/bstroy-paris-1.mp4" poster="video/bstroy-paris-1-poster.jpg"
               muted autoplay loop playsinline controls preload="metadata"></video>
      </figure>

      <!-- ---- Paris, row two: clip left, still right ---- -->
      <figure class="media media--clip">
        <video src="video/bstroy-paris-2.mp4" poster="video/bstroy-paris-2-poster.jpg"
               muted autoplay loop playsinline controls preload="metadata"></video>
      </figure>

      <figure class="media media--still media--right">
        <img src="images/looks/bstroy-paris-fur.jpg"
             alt="(b).stroy Paris FW — fur hat and printed hooded look" loading="lazy" decoding="async">
      </figure>

      <!-- ---- 07 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Essx x Troubled Waters</span>
        <span class="tile__frame"><img src="images/covers/essx-x-troubled-waters.jpg" alt="Essx with Troubled Waters" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 08 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Noid Collision FW 23</span>
        <span class="tile__frame"><img src="images/covers/noid-collision-fw-23.jpg" alt="Noid Collision FW 23" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 09 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Office Mag x Heron Preston</span>
        <span class="tile__frame"><img src="images/covers/office-mag-x-heron-preston.jpg" alt="Office Magazine with Heron Preston" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 10 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">S Rousseau</span>
        <span class="tile__frame"><img src="images/covers/s-rousseau.jpg" alt="S Rousseau" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 11 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">While It Lasted - Flanelle Magazine</span>
        <span class="tile__frame"><img src="images/covers/while-it-lasted-flanelle-magazine.jpg" alt="While It Lasted, Flanelle Magazine" loading="lazy" decoding="async"></span>
      </a>

    </div>
  </main>

  <!-- Hover glitch. "defer" means it runs after the page is parsed, so it
       never holds up the photos. If it fails or JavaScript is off, the
       page simply behaves as it did before. -->
  <script src="js/glitch.js?v=26" defer></script>

</body>
</html>
