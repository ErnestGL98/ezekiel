<!DOCTYPE html>
<html lang="en">
<head>

  <title>APOTTS AW22 — Skinfolk | EZEKIEL</title>
  <meta name="description" content="Ezekiel for APOTTS AW22, shot for Skinfolk.">
  <meta name="theme-color" content="#F2EEE7">

  <!-- The ?v=52 must match the one in style.css — see the note there. -->
  <link rel="preload" href="fonts/EzekielHand.woff2?v=52" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EzekielHand-Bold.woff2?v=52" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EzekielHand-Black.woff2?v=52" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=52">

  <!-- Same two before-first-paint jobs as the portfolio page: land at the
       top on a refresh, and arm the reveal styles early enough that the
       photos are never painted and then hidden. See portfolio.html for
       the long version. -->
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    if (window.IntersectionObserver &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('js-reveal');
      setTimeout(function () {
        if (!window.__revealReady) {
          document.documentElement.classList.remove('js-reveal');
        }
      }, 5000);
    }
  </script>
</head>

<body>

  <!-- The same header as the portfolio page, so moving between the two
       doesn't shift anything. The speaker still switches the hover sound;
       there is no music player on a gallery — see the note by the grid. -->

    <nav class="nav" aria-label="Main navigation">
      <a class="glitch-text" href="#">Contact</a>

  <main class="page-main">

    <div class="gallery-head">
      <!-- Left of the title rather than above it, so the title stays on the
           page's centre line the way the section headings do. -->
      <a class="back-link" href="portfolio.html">
        <span aria-hidden="true">&#8592;</span> Portfolio
      </a>
      <h1 class="gallery-title">APOTTS AW22 - Skinfolk</h1>
    </div>

    <!-- ============================================================
         THE SHOOT — six frames, all 2:3, so they tile without any of
         them being cropped or letterboxed.

         TO ADD ANOTHER GALLERY:
         1. python tools/build_gallery.py <slug> --newest N
         2. Copy this file, change the title and the folder in the src
         3. Point that shoot's tile in portfolio.html at the new file

         No music player here on purpose: the player restarts its
         playlist on every page load, so carrying it into a gallery would
         drop the needle back on track one every time you opened a shoot.
         The hover glitch does come along, since a photograph should
         behave the same wherever it appears.
         ============================================================ -->
    <div class="gallery">
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/01.webp" alt="APOTTS AW22 for Skinfolk, look 1" width="960" height="1440" decoding="async"></figure>
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/02.webp" alt="APOTTS AW22 for Skinfolk, look 2" width="960" height="1440" decoding="async"></figure>
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/03.webp" alt="APOTTS AW22 for Skinfolk, look 3" width="960" height="1440" loading="lazy" decoding="async"></figure>
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/04.webp" alt="APOTTS AW22 for Skinfolk, look 4" width="960" height="1440" loading="lazy" decoding="async"></figure>
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/05.webp" alt="APOTTS AW22 for Skinfolk, look 5" width="960" height="1440" loading="lazy" decoding="async"></figure>
      <figure class="shot"><img src="images/galleries/apotts-aw22-skinfolk/06.webp" alt="APOTTS AW22 for Skinfolk, look 6" width="960" height="1440" loading="lazy" decoding="async"></figure>
    </div>

  </main>

  <script src="js/reveal.js?v=52" defer></script>
  <script src="js/glitch.js?v=52" defer></script>

</html>
