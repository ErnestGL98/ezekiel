<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio — EZEKIEL</title>
  <meta name="description" content="Shoots and events from model Ezekiel's portfolio.">
  <meta name="theme-color" content="#F2EEE7">

  <!-- Both weights are used above the fold on this page (the title is
       regular, the shoot names are bold), so start both downloading
       immediately rather than waiting for the CSS to be parsed. -->
  <!-- The ?v=10 must match the one in style.css — see the note there. -->
  <link rel="preload" href="fonts/EzekielHand.woff2?v=10" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/EzekielHand-Bold.woff2?v=10" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>

<body>

  <!-- ============================================================
       HEADER
       Different from the home page's header: that one floats in white
       over the photo, this one sits in normal flow on the cream
       background, so it needs dark text and its own class.
       ============================================================ -->
  <header class="page-header">
    <a class="page-header__mark" href="./">Ezekiel</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- ============================================================
       BANNER — full-bleed strip, so it sits OUTSIDE <main> (which is
       capped at 1200px). The word PORTFOLIO is a separate layer
       stacked on top of the photo, not baked into the image, so it
       stays crisp at any size and is real selectable text.
       ============================================================ -->
  <section class="banner">
    <img
      class="banner__image"
      src="images/portfolio-banner.jpg"
      alt="Ezekiel in an orange seersucker coat and jumpsuit"
      fetchpriority="high"
      decoding="async">
    <div class="banner__scrim" aria-hidden="true"></div>
    <h1 class="banner__title">Portfolio</h1>
  </section>

  <main class="page-main">

    <!-- ============================================================
         THE GRID — one tile per shoot or event, in alphabetical order.

         TO ADD ANOTHER SHOOT:
         1. Put the photo in the "portfolio covers" folder in Downloads
         2. Run:  python tools/build_covers.py
            That shrinks it for the web. The originals are camera files
            — one was 90MB — and would take minutes to load on a phone.
         3. Copy any block below and point its src= at the new file

         TO LINK A TILE TO ITS GALLERY:
         change href="#" to that shoot's page, e.g. href="gallery-essx.html"

         The first three load straight away because they're on screen;
         the rest use loading="lazy" so they only download once you
         scroll near them.
         ============================================================ -->
    <div class="grid">

      <!-- ---- 01 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS AW22 - Skinfolk</span>
        <span class="tile__frame"><img src="images/covers/apotts-aw22-skinfolk.jpg" alt="APOTTS AW22 for Skinfolk" decoding="async"></span>
      </a>

      <!-- ---- 02 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS Ecomm 25</span>
        <span class="tile__frame"><img src="images/covers/apotts-ecomm-25.jpg" alt="APOTTS ecommerce shoot 25" decoding="async"></span>
      </a>

      <!-- ---- 03 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">APOTTS SS24 - Urbanearth</span>
        <span class="tile__frame"><img src="images/covers/apotts-ss24-urbanearth.jpg" alt="APOTTS SS24 for Urbanearth" decoding="async"></span>
      </a>

      <!-- ---- 04 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Bstroy Mohawk x Busby</span>
        <span class="tile__frame"><img src="images/covers/b-stroy-mohawk-b-usby.jpg" alt="Bstroy Mohawk with Busby" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 05 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Daveed Baptist - Soaring High SS26</span>
        <span class="tile__frame"><img src="images/covers/daveed-baptist-soaring-high-ss26.jpg" alt="Daveed Baptist, Soaring High SS26" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 06 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Essx Spring Summer</span>
        <span class="tile__frame"><img src="images/covers/essx-spring-summer.jpg" alt="Essx Spring Summer" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 07 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Essx x Troubled Waters</span>
        <span class="tile__frame"><img src="images/covers/essx-x-troubled-waters.jpg" alt="Essx with Troubled Waters" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 08 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Noid Collision FW 23</span>
        <span class="tile__frame"><img src="images/covers/noid-collision-fw-23.jpg" alt="Noid Collision FW 23" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 09 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">Office Mag x Heron Preston</span>
        <span class="tile__frame"><img src="images/covers/office-mag-x-heron-preston.jpg" alt="Office Magazine with Heron Preston" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 10 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">S Rousseau</span>
        <span class="tile__frame"><img src="images/covers/s-rousseau.jpg" alt="S Rousseau" loading="lazy" decoding="async"></span>
      </a>

      <!-- ---- 11 ---- -->
      <a class="tile" href="#">
        <span class="tile__name">While It Lasted - Flanelle Magazine</span>
        <span class="tile__frame"><img src="images/covers/while-it-lasted-flanelle-magazine.jpg" alt="While It Lasted, Flanelle Magazine" loading="lazy" decoding="async"></span>
      </a>

    </div>
  </main>

  <!-- Hover glitch. "defer" means it runs after the page is parsed, so it
       never holds up the photos. If it fails or JavaScript is off, the
       page simply behaves as it did before. -->
  <script src="js/glitch.js?v=10" defer></script>

</body>
</html>
